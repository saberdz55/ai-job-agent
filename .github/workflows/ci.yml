name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev,phone-agent,mcp]'
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Unit tests
        run: pytest -q
      - name: Agent import smoke test
        run: python -c "import job_agent.agent_core, job_agent.agent_server, job_agent.mcp_server; print('agent and MCP modules import OK')"
      - name: Offline search smoke test
        run: python -m job_agent search --demo
