name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e '.[dev,phone-agent]'
      - name: Unit tests
        run: pytest -q
      - name: Agent import smoke test
        run: python -c "from job_agent.agent_core import build_agent; from job_agent.agent_server import create_agent_app; print('agent imports OK')"
      - name: Offline search smoke test
        run: python -m job_agent search --demo
