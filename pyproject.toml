[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-agent"
version = "0.4.0"
description = "A resilient AI job-hunting and assisted-application agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aravind Pranav" }]
keywords = ["jobs", "ats", "greenhouse", "lever", "ashby", "smartrecruiters", "llm", "agent", "openai", "anthropic", "mcp"]

dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "pdfminer.six>=20240706",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "fastapi>=0.110",
]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
phone = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
phone-agent = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai-agents>=0.19.4,<0.20",
]
mcp = [
    "mcp>=1.19.0,<3",
]
desktop = [
    "playwright>=1.40",
    "uvicorn>=0.29",
    "fastapi>=0.110",
]

[project.scripts]
job-agent = "job_agent.cli:main"
job-agent-phone = "job_agent.phone:main"
job-agent-agent = "job_agent.agent_cli:main"
job-agent-agent-server = "job_agent.agent_server:main"
job-agent-mcp = "job_agent.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
